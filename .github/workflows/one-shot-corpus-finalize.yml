name: One-shot corpus finalizer

on:
  push:
    branches:
      - test/kdbx-full-corpus-gate

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/kdbx-full-corpus-gate

      - name: Format Rust and reconcile corpus documentation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          python - <<'PY'
          from pathlib import Path

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          replacements = [
              (
                  "Status: **Phase 0 in progress; the bounded KDBX compatibility path now passes the full manifest-backed accepted/adversarial corpus without escaping Rust panics or format regressions, all configured input/KDF/decompression/structure/field/attachment resource ceilings fail closed through typed errors, and independent KeePassXC plus KeePass 2.x/KPScript reopen gates are automated. Remaining Phase 0 blockers are the stable Rust handle/API model and explicit secret-buffer memory hygiene/zeroization.**",
                  "Status: **Phase 0 in progress; the bounded KDBX corpus gate now covers every manifest-backed accepted/rejected fixture plus derived outer-header/version/cipher/KDF, credential, truncation, integrity and representative resource-budget failures without escaping Rust panics. Authenticated malformed decrypted XML/invalid nesting and any duplicate/invalid-identifier behavior with defined engine semantics remain to be characterized before the corpus gate is complete; stable Rust handle/API and secret-buffer memory hygiene/zeroization follow after that.**",
              ),
              (
                  "Repository base before this roadmap update: `main` at `38085ca30d6fb87cf4c2d8d64770ea8aa4bd7708`.",
                  "Roadmap baseline for this corpus tranche: `main` at `f376bc0217aa9a7425ee5d1ebe4deb032f0b7c0a`.",
              ),
              (
                  "- Negative coverage includes malformed/truncated headers, invalid signatures and incorrect credential combinations.",
                  "- Negative coverage includes malformed/truncated headers, invalid signatures, incorrect credential combinations, derived unsupported version/cipher/KDF cases, truncated encrypted payloads, corrupted header/payload authentication data and representative typed resource-budget failures. Authenticated malformed decrypted XML/invalid nesting remains an explicit open corpus item.",
              ),
              (
                  "  - [x] Validate the chosen engine/adapter against the full manifest-backed accepted/adversarial corpus: every manifest KDBX fixture is covered, no Rust panic escapes the corpus/credential/resource-budget cases, accepted files retain expected format/version markers, malformed/credential cases fail closed, and configured input/KDF/decompression/structure/field/attachment ceilings reject through typed errors. This does not claim that `catch_unwind` proves allocation boundedness; boundedness is established by the independently enforced resource ceilings and their fail-closed tests.",
                  "  - [ ] Validate the chosen engine/adapter against the full accepted/adversarial corpus with no panics, no unbounded allocation and no format regressions.\n    - [x] Gate every manifest-backed KDBX fixture through the bounded adapter; accepted files retain expected format/version/content markers while manifest malformed-header/signature cases and incorrect credentials fail closed without an escaping Rust panic.\n    - [x] Add deterministic derived adversarial coverage for unsupported major version, invalid outer-header field length, unsupported cipher/KDF identifiers, truncated encrypted payload, corrupted header authentication and corrupted payload integrity; require fail-closed Fortress error categories without escaping Rust panics.\n    - [x] Exercise representative input/KDF/decompression/structure/field/custom-data/per-attachment/aggregate-attachment resource ceilings through the integrated corpus gate. `catch_unwind` is only a panic-containment assertion; allocation boundedness is established by the separately enforced preflight, bounded-decompression and post-decrypt resource ceilings plus their fail-closed tests.\n    - [ ] Add authenticated malformed decrypted XML / invalid nesting coverage, then characterize duplicate or otherwise invalid identifiers wherever the pinned engine exposes defined behavior. Close the parent gate only when these residual adversarial classes are deterministic and panic-free.",
              ),
              (
                  "1. **KDBX compatibility/corpus validation is no longer the active write blocker.** The version policy remains explicit: initial writes target KDBX 4.1 only, KDBX 4.0 migration is a deliberate operation rather than Save, and KDBX 3.1 remains read-only. History preservation, unknown-XML fail-closed handling, positive fixture materialization, the full manifest-backed accepted/adversarial corpus, KeePassXC reopening and pinned KeePass 2.x/KPScript reopening are automated. Production write exposure is now blocked on the stable Rust handle/API contract and secret-buffer memory hygiene/zeroization.\n2. **Production KDBX open/decrypt exposure is blocked on the stable Rust handle/API plus secret-buffer memory-hygiene work.** The compatibility/corpus and Fortress-owned resource-budget gates are complete.\n3. **Production Android vault operations are blocked on the stable Rust handle/JNI contract and secret-buffer memory hygiene.**\n4. **Public release is blocked on completing Phases 0–6 and the release gate, including a fresh dependency/license/security review of the exact versions shipped.**",
                  "1. **KDBX corpus validation remains narrowly blocked on authenticated malformed decrypted XML/invalid nesting and any duplicate/invalid-identifier cases for which the pinned engine has defined semantics.** The version policy remains explicit: initial writes target KDBX 4.1 only, KDBX 4.0 migration is deliberate rather than Save, and KDBX 3.1 remains read-only. Positive fixtures, manifest failures, credentials, outer-header/version/cipher/KDF mutations, truncation/integrity mutations, resource ceilings, history/unknown-XML write protection and independent KeePassXC/KeePass reopening are already automated.\n2. **Production KDBX open/decrypt exposure is blocked on closing that residual corpus gate, then implementing the stable Rust handle/API and secret-buffer memory-hygiene work.** The Fortress-owned resource-budget gate itself is complete.\n3. **Production Android vault operations are blocked on the stable Rust handle/JNI contract and secret-buffer memory hygiene.**\n4. **Public release is blocked on completing Phases 0–6 and the release gate, including a fresh dependency/license/security review of the exact versions shipped.**",
              ),
              (
                  "1. [ ] Define and implement the stable Rust handle/API model while preserving the invariant that decrypted vault state remains inside Rust.\n2. [ ] Define and implement the zeroization/secret-buffer strategy for passwords, composite-key material, key-file bytes and sensitive temporary buffers.\n3. [ ] Extend the JNI contract only after those Phase-0 gates are proven, then expose bounded read-only vault operations to Android.",
                  "1. [ ] Close the residual adversarial corpus gap with authenticated malformed decrypted XML/invalid nesting and defined invalid-identifier cases; keep the integrated gate deterministic and panic-free.\n2. [ ] Define and implement the stable Rust handle/API model while preserving the invariant that decrypted vault state remains inside Rust.\n3. [ ] Define and implement the zeroization/secret-buffer strategy for passwords, composite-key material, key-file bytes and sensitive temporary buffers; extend JNI only after these Phase-0 gates are proven.",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"ROADMAP replacement anchor missing: {old[:80]}")
              text = text.replace(old, new)
          roadmap.write_text(text, encoding="utf-8")

          matrix = Path("docs/KDBX_COMPATIBILITY_MATRIX.md")
          text = matrix.read_text(encoding="utf-8")
          anchor = "Their decoded SHA-256 values and creator/version metadata are fixed in `test-fixtures/kdbx/manifest.json`. This closes the remaining positive fixture-matrix materialization gaps; the separate full-corpus no-panic/no-regression gate remains required."
          addition = anchor + """

          ### Integrated adversarial-gate status

          `rust/vault-core/tests/kdbx_full_corpus.rs` now integrates the manifest-backed corpus with deterministic derived failure cases. It currently covers:

          - every KDBX fixture declared in `test-fixtures/kdbx/manifest.json`;
          - wrong password and missing key-file rejection;
          - unsupported major KDBX version;
          - invalid outer-header field length;
          - unsupported outer-cipher and KDF identifiers;
          - truncated encrypted payload;
          - corrupted header authentication and encrypted-payload integrity;
          - representative input, Argon2, decompressed-payload, group-depth, entry-count, field-size, custom-data, per-attachment and aggregate-attachment resource ceilings;
          - a `catch_unwind` boundary around corpus, credential, derived-malformation and resource-limit cases so an engine panic cannot silently satisfy the gate.

          The remaining adversarial classes before this gate can be marked complete are **authenticated malformed decrypted XML / invalid nesting** and **duplicate or otherwise invalid identifiers where the pinned engine exposes defined behavior**. These require authenticated post-decrypt inputs rather than arbitrary ciphertext mutation so the XML/parser path is actually exercised.

          `catch_unwind` is not treated as proof of bounded allocation. Allocation/work boundedness comes from the independently enforced pre-decrypt KDF/input limits, bounded decompression/attachment expansion and post-decrypt structure/value ceilings, each with fail-closed tests.
          """
          if anchor not in text:
              raise SystemExit("compatibility-matrix insertion anchor missing")
          matrix.write_text(text.replace(anchor, addition), encoding="utf-8")
          PY

      - name: Commit finalized branch state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-corpus-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finalize expanded KDBX corpus gate"
          git push origin HEAD:test/kdbx-full-corpus-gate
