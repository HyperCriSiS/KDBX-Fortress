name: automation sync negative fixture roadmap
on:
  push:
    paths:
      - '.github/workflows/automation-sync-negative-fixture-roadmap.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update roadmap from verified fixture state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          entry = '- [x] Materialize a deterministic truncated-header KDBX4 negative fixture with SHA-256 manifest metadata and an explicit `expected_failure` contract; validate positive and negative fixture schemas separately (`06ed267b`).\n'
          if entry not in s:
              lines = s.splitlines(keepends=True)
              candidates = ('adversarial', 'negative', 'fixture')
              idx = next((i for i,l in enumerate(lines) if '[ ]' in l and all(x in l.lower() for x in ('fixture',)) and any(x in l.lower() for x in ('negative','adversarial'))), None)
              if idx is None:
                  idx = next((i for i,l in enumerate(lines) if '[ ]' in l and 'fixture' in l.lower()), None)
              if idx is None:
                  raise SystemExit('fixture roadmap anchor missing')
              lines.insert(idx + 1, entry)
              p.write_text(''.join(lines), encoding='utf-8')
          PY
          python3 tools/validate_kdbx_fixtures.py
          git diff --check
      - name: Commit roadmap and remove helper
        run: |
          rm -f .github/workflows/automation-sync-negative-fixture-roadmap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md .github/workflows/automation-sync-negative-fixture-roadmap.yml
          git commit -m 'docs: record truncated KDBX fixture' || exit 0
          git push origin HEAD:main
