name: Foundation

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Source policy and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run foundation checks
        run: python tools/run_foundation_checks.py

  rust-core:
    name: Rust vault-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
          rustup --version

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        env:
          FORTRESS_INTEROP_OUTPUT_DIR: ${{ runner.temp }}/kdbx-interop
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets

      - name: Install KeePassXC reference CLI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes keepassxc
          keepassxc-cli --version

      - name: Reopen Fortress KDBX 4.1 outputs with KeePassXC
        env:
          FIXTURE_PASSWORD: fixture-password
          INTEROP_DIR: ${{ runner.temp }}/kdbx-interop
        run: |
          set -euo pipefail

          password_databases=(
            argon2id-aes-41.kdbx
            argon2id-chacha20-41.kdbx
            unicode-41.kdbx
            attachments-custom-data-41.kdbx
            history-41.kdbx
          )

          for database in "${password_databases[@]}"; do
            test -s "$INTEROP_DIR/$database"
            printf '%s\n' "$FIXTURE_PASSWORD" | \
              keepassxc-cli db-info "$INTEROP_DIR/$database" >/dev/null
          done

          test -s "$INTEROP_DIR/composite-key-41.kdbx"
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli db-info \
              -k test-fixtures/kdbx/kdbx4-composite-key.raw32.key \
              "$INTEROP_DIR/composite-key-41.kdbx" >/dev/null

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Check Android ARM64 target
        run: cargo check --manifest-path rust/Cargo.toml --workspace --target aarch64-linux-android

      - name: Check Android x86_64 target
        run: cargo check --manifest-path rust/Cargo.toml --workspace --target x86_64-linux-android

  engine-fork-validation:
    name: keepass-rs fork validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Verify exact Fortress fork commit
        env:
          ENGINE_REV: ecfbd039389426fd97362243dee08ae506e80d58
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/HyperCriSiS/keepass-rs.git keepass-rs
          cd keepass-rs
          git checkout "$ENGINE_REV"
          test "$(git rev-parse HEAD)" = "$ENGINE_REV"
          rustc --version --verbose
          cargo --version
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
