name: Foundation

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Source policy and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run foundation checks
        run: python tools/run_foundation_checks.py

  rust-core:
    name: Rust vault-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
          rustup --version

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        env:
          FORTRESS_INTEROP_OUTPUT_DIR: ${{ runner.temp }}/kdbx-interop
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets

      - name: Install KeePassXC reference CLI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes keepassxc
          keepassxc-cli --version

      - name: Reopen Fortress KDBX 4.1 outputs with KeePassXC
        env:
          FIXTURE_PASSWORD: fixture-password
          INTEROP_DIR: ${{ runner.temp }}/kdbx-interop
        run: |
          set -euo pipefail

          password_databases=(
            argon2id-aes-41.kdbx
            argon2id-chacha20-41.kdbx
            unicode-41.kdbx
            attachments-custom-data-41.kdbx
            history-41.kdbx
          )

          for database in "${password_databases[@]}"; do
            test -s "$INTEROP_DIR/$database"
            printf '%s\n' "$FIXTURE_PASSWORD" | \
              keepassxc-cli db-info "$INTEROP_DIR/$database" >/dev/null
          done

          test -s "$INTEROP_DIR/composite-key-41.kdbx"
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli db-info \
              -k test-fixtures/kdbx/kdbx4-composite-key.raw32.key \
              "$INTEROP_DIR/composite-key-41.kdbx" >/dev/null

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Check Android ARM64 target
        run: cargo check --manifest-path rust/Cargo.toml --workspace --target aarch64-linux-android

      - name: Check Android x86_64 target
        run: cargo check --manifest-path rust/Cargo.toml --workspace --target x86_64-linux-android

  keepass2-reference:
    name: KeePass 2.x interoperability
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify pinned KeePass reference tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $toolsDir = Join-Path $env:RUNNER_TEMP 'keepass-reference'
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

          $keepassZip = Join-Path $toolsDir 'KeePass-2.61.1.zip'

          function Get-VerifiedReferencePackage {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$Url,
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][long]$ExpectedSize,
              [Parameter(Mandatory = $true)][string]$ExpectedSha256,
              [int]$Attempts = 4
            )

            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              Remove-Item -LiteralPath $Path -Force -ErrorAction SilentlyContinue
              & curl.exe --fail --location --retry 3 --retry-all-errors --retry-delay 2 --header 'Cache-Control: no-cache' --output $Path $Url
              $curlExit = $LASTEXITCODE

              if ($curlExit -eq 0 -and (Test-Path -LiteralPath $Path -PathType Leaf)) {
                $item = Get-Item -LiteralPath $Path
                $actualSha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToUpperInvariant()
                if ($item.Length -eq $ExpectedSize -and $actualSha256 -eq $ExpectedSha256) {
                  Write-Host "$Name verified on attempt $attempt."
                  return
                }

                Write-Warning "$Name download attempt $attempt rejected by pin: size=$($item.Length), sha256=$actualSha256"
              } else {
                Write-Warning "$Name download attempt $attempt failed (curl exit $curlExit)."
              }

              if ($attempt -lt $Attempts) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }

            throw "$Name failed strict size/SHA-256 verification after $Attempts attempts"
          }

          Get-VerifiedReferencePackage `
            -Name 'KeePass 2.61.1' `
            -Url 'https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.61.1/KeePass-2.61.1.zip/download?use_mirror=phoenixnap' `
            -Path $keepassZip `
            -ExpectedSize 2898806 `
            -ExpectedSha256 '3952354DB9B117E906F7CD4F9F5591065B95186472370DA47F46F3E246FEA864'

          $keepassDir = Join-Path $toolsDir 'keepass'
          Expand-Archive -LiteralPath $keepassZip -DestinationPath $keepassDir

          $keepassExe = Get-ChildItem -Path $keepassDir -Filter 'KeePass.exe' -Recurse | Select-Object -First 1
          if (-not $keepassExe) { throw 'KeePass.exe missing from verified portable package' }

          "KEEPASS_REFERENCE_DIR=$($keepassExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate Fortress KDBX 4.1 reference outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FORTRESS_INTEROP_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'kdbx-interop'
          New-Item -ItemType Directory -Force -Path $env:FORTRESS_INTEROP_OUTPUT_DIR | Out-Null
          rustc --version --verbose
          cargo --version
          cargo test --manifest-path rust/Cargo.toml --package kdbx-fortress-vault-core --test kdbx_roundtrip

      - name: Reopen Fortress outputs with KeePass 2.x
        # KeePass 2.x targets the classic .NET Framework and uses
        # System.Security.Cryptography.ProtectedMemory, which is unavailable
        # when its assembly is loaded into PowerShell 7/.NET Core.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $keepassExe = Join-Path $env:KEEPASS_REFERENCE_DIR 'KeePass.exe'
          if (-not (Test-Path -LiteralPath $keepassExe -PathType Leaf)) {
            throw 'Verified KeePass.exe reference is missing'
          }
          [void][System.Reflection.Assembly]::LoadFrom($keepassExe)

          $interopDir = Join-Path $env:RUNNER_TEMP 'kdbx-interop'
          $fixturePassword = 'fixture-password'

          function Test-KeePassReferenceOpen {
            param(
              [Parameter(Mandatory = $true)][string]$DatabasePath,
              [Parameter(Mandatory = $true)][string]$Password,
              [string]$KeyFilePath
            )

            $database = New-Object KeePassLib.PwDatabase
            $compositeKey = New-Object KeePassLib.Keys.CompositeKey
            $compositeKey.AddUserKey((New-Object KeePassLib.Keys.KcpPassword($Password)))
            if ($KeyFilePath) {
              $compositeKey.AddUserKey((New-Object KeePassLib.Keys.KcpKeyFile($KeyFilePath)))
            }

            $connection = New-Object KeePassLib.Serialization.IOConnectionInfo
            $connection.Path = $DatabasePath
            $logger = New-Object KeePassLib.Interfaces.NullStatusLogger

            try {
              $database.Open($connection, $compositeKey, $logger)
              if (-not $database.IsOpen) {
                throw "KeePass 2.x did not open $DatabasePath"
              }
              # Force traversal of the decrypted object model so this is more than
              # a header-only/open-call compatibility check.
              $null = $database.RootGroup.GetEntries($true).Count
            } finally {
              if ($database.IsOpen) {
                $database.Close()
              }
            }
          }

          $passwordDatabases = @(
            'argon2id-aes-41.kdbx',
            'argon2id-chacha20-41.kdbx',
            'unicode-41.kdbx',
            'attachments-custom-data-41.kdbx',
            'history-41.kdbx'
          )

          foreach ($databaseName in $passwordDatabases) {
            $database = Join-Path $interopDir $databaseName
            if (-not (Test-Path -LiteralPath $database -PathType Leaf)) {
              throw "Missing Fortress interoperability output: $databaseName"
            }
            Test-KeePassReferenceOpen -DatabasePath $database -Password $fixturePassword
          }

          $compositeDatabase = Join-Path $interopDir 'composite-key-41.kdbx'
          $keyFile = Join-Path $env:GITHUB_WORKSPACE 'test-fixtures\kdbx\kdbx4-composite-key.raw32.key'
          if (-not (Test-Path -LiteralPath $compositeDatabase -PathType Leaf)) {
            throw 'Missing Fortress composite-key interoperability output'
          }
          if (-not (Test-Path -LiteralPath $keyFile -PathType Leaf)) {
            throw 'Missing deterministic composite-key sidecar'
          }

          Test-KeePassReferenceOpen `
            -DatabasePath $compositeDatabase `
            -Password $fixturePassword `
            -KeyFilePath $keyFile
