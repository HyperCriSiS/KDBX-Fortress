name: One-shot hardened engine pin

on:
  push:
    branches:
      - security/pin-memory-hardened-engine
    paths:
      - .github/workflows/one-shot-pin-memory-hardened-engine.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/pin-memory-hardened-engine
          fetch-depth: 0
      - name: Update pin and security documentation
        shell: python
        run: |
          from pathlib import Path

          old = "86c53bbb1bf35c3c83d5e25dfa13942e062b9293"
          new = "bdf81aa77cafdf6651c0909d4dbcceb2a15ad227"

          cargo_path = Path("rust/vault-core/Cargo.toml")
          cargo = cargo_path.read_text()
          assert cargo.count(old) == 2
          cargo_path.write_text(cargo.replace(old, new))

          secret_path = Path("docs/SECRET_MEMORY.md")
          secret = secret_path.read_text()
          old_section = '''## Fork hardening still required before decrypted vault state is attached to handles

          The upstream engine already wipes `DatabaseKey`, and protected entry values use `secrecy::SecretBox`. The current pinned fork still creates additional owned sensitive temporaries during KDBX processing. Before `VaultHandle` owns a decrypted `Database`, the fork must additionally wipe or RAII-wrap, on success and error paths:

          - key elements derived from password/key-file/challenge response;
          - composite, transformed, master, HMAC and per-block HMAC keys;
          - cipher-owned key copies where the RustCrypto type does not itself provide the required drop guarantee;
          - decrypted, decompressed and serialized plaintext payload buffers;
          - KDBX4 inner random-stream key material;
          - unprotected entry/attachment values when their owning database is dropped.

          `Database::get_xml` is a legacy plaintext-returning engine helper. Fortress production code must not expose or use it as an API boundary.
          '''
          new_section = '''## Fork hardening now proven for the initial read-only owner boundary

          The pinned Fortress `keepass-rs` fork at `bdf81aa77cafdf6651c0909d4dbcceb2a15ad227` completed the defined Phase-0 engine-owned memory-hygiene gate under its full CI matrix. In addition to `DatabaseKey` and protected values, the fork now:

          - stores key elements derived from password/key-file/challenge response in zeroizing owners;
          - moves transformed, master and KDBX4 HMAC keys into zeroizing byte owners immediately after the fixed-array hash/KDF API boundary;
          - zeroizes generated per-block HMAC keys;
          - zeroizes decrypted/compressed and decompressed KDBX3/KDBX4 plaintext scratch on success and error paths;
          - zeroizes KDBX3 protected-stream and KDBX4 inner-random-stream raw key material;
          - enables RustCrypto `zeroize` support for Salsa20 and ChaCha20 state;
          - explicitly zeroizes unprotected entry/attachment values when their owning `Value` is dropped.

          `Database::get_xml` remains a legacy plaintext-returning engine helper. Fortress production code must not expose or use it as an API boundary.
          '''
          assert old_section in secret
          secret = secret.replace(old_section, new_section)
          old_non = "Hash/HMAC/Argon2, AES/Twofish/Salsa/ChaCha, XML parsing and decompression libraries can hold implementation-internal state. Their lifetime should be kept narrow and their own zeroization behavior audited separately; Fortress must not claim those hidden copies are erased unless the dependency provides such a guarantee."
          new_non = "The current SHA/KDF helper APIs return short-lived `hybrid_array::Array` values that do not implement `Zeroize` in the pinned dependency combination. The fixed composite-key array and transient digest/KDF return arrays therefore cannot currently be proven wiped; Fortress moves their sensitive results into zeroizing owners immediately after those API boundaries. More generally, Hash/HMAC/Argon2, AES/Twofish, XML parsing and decompression libraries can retain implementation-internal state outside Fortress ownership. Fortress must not claim those hidden copies are erased unless the dependency itself provides that guarantee. Salsa20 and ChaCha20 are an exception in the pinned fork because their RustCrypto `zeroize` features are explicitly enabled."
          assert old_non in secret
          secret = secret.replace(old_non, new_non)
          old_lock = '''## Lock invariant for the next lifecycle tranche

          A future `VaultHandle::lock` may be treated as a security boundary only after the decrypted vault owner has been audited so dropping it destroys all Fortress/fork-owned sensitive buffers covered above. The existing handle registry already invalidates the handle and drops the owned Rust value immediately; this document deliberately does **not** yet claim that an entire parsed database is comprehensively wiped on lock.
          '''
          new_lock = '''## Lock invariant for the next lifecycle tranche

          The engine-owned memory-hygiene prerequisites for attaching a decrypted database to the Rust handle registry are now satisfied for the defined initial read-only boundary. The next tranche must introduce a concrete Rust vault owner whose `Drop` path owns the parsed database and any Fortress-side session state, then prove that `VaultHandle::lock`/`lock_all` immediately destroy that owner while invalidating the generation-checked handle. This still does **not** imply total process-memory erasure because the explicit non-guarantees above remain in force.
          '''
          assert old_lock in secret
          secret_path.write_text(secret.replace(old_lock, new_lock))

          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text()
          old_status = "Status: **Phase 0 in progress; the defined KDBX accepted/adversarial corpus gate is complete and the first stable-handle tranche now establishes an opaque generation-checked `VaultHandle` plus a bounded Rust-owned registry with stale-handle rejection and idempotent lock/drop semantics. The stable handle/API parent remains open until a concrete Rust vault owner/lifecycle API and Kotlin/JNI wrapper are integrated. Secret-buffer memory hygiene/zeroization is the next security gate and must be proven before production vault opening is exposed.**"
          new_status = "Status: **Phase 0 in progress; the defined KDBX accepted/adversarial corpus gate, opaque generation-checked handle registry, Fortress credential boundary and initial engine-owned secret-memory/zeroization gate are complete. The stable handle/API parent remains open until a concrete Rust vault owner/lifecycle API and Kotlin/JNI wrapper are integrated. The next security-critical tranche is the concrete Rust vault owner: decrypted state must remain Rust-owned and `lock`/`lock_all` must immediately drop it before any production vault opening is exposed.**"
          assert old_status in roadmap
          roadmap = roadmap.replace(old_status, new_status)
          assert old in roadmap
          roadmap = roadmap.replace(old, new)
          old_mem = "- [ ] Add explicit memory hygiene for composite keys and sensitive secret buffers, including zeroization wrappers where upstream types retain owned secret material."
          new_mem = '''- [x] Add explicit memory hygiene for composite keys and sensitive secret buffers, including zeroization wrappers where upstream types retain owned secret material.
            - [x] Fortress-owned password/key-file inputs use zeroizing byte owners; `VaultCredentials` is non-`Clone`, redacted in `Debug`, and bounded-open borrows the password only at the narrow engine conversion point.
            - [x] Pin the hardened Fortress `keepass-rs` fork after its full CI matrix proved zeroizing ownership for key-element vectors, transformed/master/HMAC/per-block HMAC material, decrypted/decompressed plaintext scratch, protected-stream/inner-stream key bytes, unprotected stored values and Salsa20/ChaCha20 state.
            - [x] Document the residual short-lived `hybrid_array::Array` hash/KDF boundary and explicitly avoid any total-process-memory-erasure claim.'''
          assert old_mem in roadmap
          roadmap = roadmap.replace(old_mem, new_mem)
          old_block1 = "1. **Production KDBX open/decrypt exposure is blocked on secret-buffer memory hygiene/zeroization and completion of the concrete Rust vault owner/lifecycle API.** The foundational opaque generation-checked handle registry is implemented, while the Phase-0 accepted/adversarial corpus, write-policy/round-trip evidence, Fortress-owned resource-budget gates and independent KeePassXC/KeePass reopening gates are complete for the defined surface."
          new_block1 = "1. **Production KDBX open/decrypt exposure is blocked on completion of the concrete Rust vault owner/lifecycle API.** The foundational opaque generation-checked handle registry and the defined initial Fortress/fork-owned secret-memory hygiene gate are implemented, while the Phase-0 accepted/adversarial corpus, write-policy/round-trip evidence, Fortress-owned resource-budget gates and independent KeePassXC/KeePass reopening gates are complete for the defined surface."
          assert old_block1 in roadmap
          roadmap = roadmap.replace(old_block1, new_block1)
          old_block2 = "2. **Production Android vault operations remain blocked on the concrete Rust owner/API plus Kotlin/JNI wrapper and secret-buffer memory hygiene.**"
          new_block2 = "2. **Production Android vault operations remain blocked on the concrete Rust owner/API plus Kotlin/JNI wrapper.** The initial Rust/Fortress secret-memory gate is complete, but JNI must preserve the same byte-oriented credential and Rust-only decrypted-state ownership invariants."
          assert old_block2 in roadmap
          roadmap = roadmap.replace(old_block2, new_block2)
          old_next = '''1. [ ] Define and implement the zeroization/secret-buffer strategy for passwords, composite-key material, key-file bytes and sensitive temporary buffers; document unavoidable upstream copies and eliminate Fortress-owned residual secret buffers on drop/error paths.
          2. [ ] Integrate the proven handle registry into a concrete Rust vault owner/lifecycle API while preserving the invariant that decrypted vault state remains inside Rust.
          3. [ ] Add the Kotlin/JNI wrapper only after the secret-memory and concrete Rust owner/API gates are proven, beginning with bounded read-only vault operations and stable sanitized errors.'''
          new_next = '''1. [ ] Integrate the proven handle registry into a concrete Rust vault owner/lifecycle API while preserving the invariant that decrypted vault state remains inside Rust; prove `lock`/`lock_all` immediately drop the concrete owner and invalidate all stale generations.
          2. [ ] Add the Kotlin/JNI wrapper only after the concrete Rust owner/API gate is proven, beginning with bounded read-only vault operations, byte-oriented credentials and stable sanitized errors.
          3. [ ] Expand lifecycle/concurrency/property/fuzz coverage around the concrete owner before broadening the production API.'''
          assert old_next in roadmap
          roadmap_path.write_text(roadmap.replace(old_next, new_next))
      - name: Remove helper workflow
        run: rm .github/workflows/one-shot-pin-memory-hardened-engine.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/vault-core/Cargo.toml docs/SECRET_MEMORY.md ROADMAP.md .github/workflows/one-shot-pin-memory-hardened-engine.yml
          git commit -m "security: pin memory-hardened keepass engine"
          git push origin HEAD:security/pin-memory-hardened-engine