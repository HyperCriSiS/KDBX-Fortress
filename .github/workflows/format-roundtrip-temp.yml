name: Temporary Rustfmt

on:
  push:
    branches:
      - test/kdbx4-roundtrip-harness
    paths:
      - rust/vault-core/tests/kdbx_roundtrip.rs
      - .github/workflows/format-roundtrip-temp.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: test/kdbx4-roundtrip-harness
      - name: Use pinned Rust toolchain
        run: rustup show
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/vault-core/tests/kdbx_roundtrip.rs
          git commit -m "style: apply rustfmt to round-trip harness"
          git push origin HEAD:test/kdbx4-roundtrip-harness
