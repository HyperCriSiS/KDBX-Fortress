name: automation materialize bad-signature KDBX fixture
on:
  push:
    paths:
      - '.github/workflows/automation-materialize-bad-signature-kdbx.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize deterministic bad-signature fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('test-fixtures/kdbx')
          source = root / 'basic-kdbx4.kdbx'
          target = root / 'bad-signature-kdbx4.kdbx'
          data = bytearray(source.read_bytes())
          if len(data) < 12:
              raise SystemExit('basic KDBX4 fixture unexpectedly short')
          data[0] ^= 0xFF
          target.write_bytes(bytes(data))
          digest = hashlib.sha256(target.read_bytes()).hexdigest()

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          fixtures = [f for f in manifest['fixtures'] if f.get('file') != target.name]
          fixtures.append({
              'file': target.name,
              'sha256': digest,
              'format': 'KDBX4',
              'purpose': 'deterministic invalid-signature rejection fixture',
              'expected_failure': 'invalid_signature',
          })
          manifest['fixtures'] = fixtures
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '- `bad-signature-kdbx4.kdbx`: deterministic negative fixture derived from the basic KDBX4 fixture with the first signature byte corrupted; future vault engines must reject it as an invalid KDBX signature without panic.'
          if 'bad-signature-kdbx4.kdbx' not in readme:
              readme_path.write_text(readme.rstrip() + '\n\n' + note + '\n', encoding='utf-8')
          PY
          python3 tools/validate_kdbx_fixtures.py
          git diff --check
      - name: Commit fixture and remove helper
        run: |
          rm -f .github/workflows/automation-materialize-bad-signature-kdbx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: add invalid-signature KDBX negative fixture'
          git push origin HEAD:main
