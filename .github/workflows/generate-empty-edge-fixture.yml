name: Generate empty-edge fixture

"on":
  push:
    branches:
      - test/kdbx-empty-edge-fixture

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/kdbx-empty-edge-fixture
          persist-credentials: true

      - name: Generate fixture once
        run: |
          set -euo pipefail
          fixture="test-fixtures/kdbx/kdbx4-empty-edge.kdbx"
          if [ -f "$fixture" ]; then
            echo "Fixture already exists; generator is a no-op."
            exit 0
          fi

          export FORTRESS_FIXTURE_OUTPUT="$GITHUB_WORKSPACE/$fixture"
          cargo test \
            --manifest-path rust/Cargo.toml \
            --package kdbx-fortress-vault-core \
            --test generate_empty_edge_fixture \
            -- --ignored --exact generate_kdbx4_empty_edge_fixture

          test -s "$fixture"
          sha256sum "$fixture"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$fixture"
          git commit -m "test: materialize KDBX4 empty-edge fixture"
          git push origin HEAD:test/kdbx-empty-edge-fixture
