name: Synchronize Format300 roadmap provenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-fix-format300-roadmap.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct pinned Format300 blob in roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          old = '2a71e8c3c2cc9bb1e68f86badda6b36fb4ffa107'
          new = 'dc67f35a11ec8caf49583798280aa883657436e2'
          if old not in text:
              raise SystemExit('expected stale Format300 blob not found in ROADMAP.md')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/automation-fix-format300-roadmap.yml
      - name: Commit corrected roadmap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md .github/workflows/automation-fix-format300-roadmap.yml
          git diff --cached --check
          git commit -m 'docs: correct Format300 roadmap provenance'
          git push origin HEAD:main