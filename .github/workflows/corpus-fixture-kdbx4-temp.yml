name: KDBX4 corpus fixture correction (temporary)

on:
  push:
    branches:
      - test/kdbx-accepted-corpus-gaps

permissions:
  contents: write

jobs:
  correct:
    if: "github.event.head_commit.message != 'test: rematerialize accepted corpus as KDBX4'"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install KeePassXC
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes keepassxc
          keepassxc-cli --version

      - name: Generate and verify KDBX4 fixtures
        shell: bash
        env:
          FIXTURE_PASSWORD: fixture-password
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/fortress-corpus-kdbx4"
          mkdir -p "$work"

          create_source_db() {
            local path="$1"
            printf '%s\n%s\n' "$FIXTURE_PASSWORD" "$FIXTURE_PASSWORD" | \
              keepassxc-cli db-create -p -t 100 "$path"
          }

          to_kdbx4() {
            local source="$1"
            local target="$2"
            local xml="$3"
            printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli export "$source" > "$xml"
            printf '%s\n%s\n' "$FIXTURE_PASSWORD" "$FIXTURE_PASSWORD" | \
              keepassxc-cli import -p -t 100 "$xml" "$target"
          }

          empty_source="$work/empty-source.kdbx"
          empty_xml="$work/empty.xml"
          empty_db="$work/kdbx4-empty-edge.kdbx"
          create_source_db "$empty_source"
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli mkdir "$empty_source" 'Empty Group'
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli add --username '' --url '' --notes '' "$empty_source" 'Blank Fields'
          to_kdbx4 "$empty_source" "$empty_db" "$empty_xml"

          large_source="$work/large-source.kdbx"
          large_xml="$work/large.xml"
          large_db="$work/kdbx4-large-bounded.kdbx"
          large_attachment="$work/payload.bin"
          large_notes="$work/large-notes.txt"
          create_source_db "$large_source"
          python - <<'PY'
          from pathlib import Path
          import os

          work = Path(os.environ['RUNNER_TEMP']) / 'fortress-corpus-kdbx4'
          work.joinpath('payload.bin').write_bytes(bytes(range(256)) * 1024)
          work.joinpath('large-notes.txt').write_text('N' * 65536, encoding='utf-8')
          PY
          notes="$(cat "$large_notes")"
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli add \
              --username 'large-user' \
              --url 'https://large.example.test' \
              --notes "$notes" \
              "$large_source" 'Large Fixture'
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli attachment-import \
              "$large_source" 'Large Fixture' 'payload.bin' "$large_attachment"
          to_kdbx4 "$large_source" "$large_db" "$large_xml"

          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli db-info "$empty_db" >/dev/null
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli db-info "$large_db" >/dev/null
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli show --all "$empty_db" 'Blank Fields' >/dev/null
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli show --all --show-attachments "$large_db" 'Large Fixture' >/dev/null

          export EMPTY_DB="$empty_db"
          export LARGE_DB="$large_db"
          export LARGE_ATTACHMENT="$large_attachment"
          export KEEPASSXC_VERSION="$(keepassxc-cli --version | tr -d '\r')"
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import os
          import struct

          def version(path: str):
              data = Path(path).read_bytes()
              raw = struct.unpack('<I', data[8:12])[0]
              return raw >> 16, raw & 0xffff

          empty_version = version(os.environ['EMPTY_DB'])
          large_version = version(os.environ['LARGE_DB'])
          if empty_version[0] != 4 or large_version[0] != 4:
              raise SystemExit(f'expected KDBX4, got empty={empty_version}, large={large_version}')

          fixtures_dir = Path('test-fixtures/kdbx')
          for source_env, output in [
              ('EMPTY_DB', 'kdbx4-empty-edge.kdbx.b64'),
              ('LARGE_DB', 'kdbx4-large-bounded.kdbx.b64'),
          ]:
              data = Path(os.environ[source_env]).read_bytes()
              fixtures_dir.joinpath(output).write_text(base64.b64encode(data).decode('ascii'), encoding='ascii')

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest_path = fixtures_dir / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          by_file = {entry['file']: entry for entry in manifest['fixtures']}
          creator = {
              'implementation': 'KeePassXC CLI export/import',
              'version': os.environ['KEEPASSXC_VERSION'],
          }

          empty = by_file['kdbx4-empty-edge.kdbx.b64']
          empty.update({
              'sha256': sha256(os.environ['EMPTY_DB']),
              'format': f'KDBX4.{empty_version[1]}',
              'creator': creator,
              'purpose': 'independently generated KDBX4 fixture covering empty strings, omitted optional entry fields and an empty group',
          })

          large = by_file['kdbx4-large-bounded.kdbx.b64']
          large.update({
              'sha256': sha256(os.environ['LARGE_DB']),
              'format': f'KDBX4.{large_version[1]}',
              'creator': creator,
              'purpose': 'independently generated KDBX4 fixture with a large entry field and deterministic attachment for near-limit acceptance/rejection tests',
          })
          large['expected']['attachment']['sha256'] = sha256(os.environ['LARGE_ATTACHMENT'])

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'empty KDBX version: {empty_version[0]}.{empty_version[1]}')
          print(f'large KDBX version: {large_version[0]}.{large_version[1]}')
          PY

          python tools/validate_kdbx_fixtures.py

      - name: Commit corrected fixtures
        shell: bash
        run: |
          git diff --check
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add \
            test-fixtures/kdbx/kdbx4-empty-edge.kdbx.b64 \
            test-fixtures/kdbx/kdbx4-large-bounded.kdbx.b64 \
            test-fixtures/kdbx/manifest.json
          git commit -m "test: rematerialize accepted corpus as KDBX4"
          git push origin HEAD:test/kdbx-accepted-corpus-gaps