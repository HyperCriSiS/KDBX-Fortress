name: automation materialize truncated KDBX fixture
on:
  push:
    paths:
      - '.github/workflows/automation-materialize-truncated-kdbx.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize deterministic negative fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('test-fixtures/kdbx')
          source = root / 'basic-kdbx4.kdbx'
          target = root / 'truncated-header-kdbx4.kdbx'
          target.write_bytes(source.read_bytes()[:8])
          digest = hashlib.sha256(target.read_bytes()).hexdigest()

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          fixtures = manifest['fixtures']
          fixtures = [f for f in fixtures if f.get('file') != target.name]
          fixtures.append({
              'file': target.name,
              'sha256': digest,
              'format': 'KDBX4',
              'purpose': 'deterministic truncated-header rejection fixture',
              'expected_failure': 'truncated_header',
          })
          manifest['fixtures'] = fixtures
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator_path = Path('tools/validate_kdbx_fixtures.py')
          validator = validator_path.read_text(encoding='utf-8')
          old = "    assert isinstance(entry.get('expected'), dict) and entry['expected'], f'missing expected content for {path.name}'\n"
          new = "    if 'expected_failure' in entry:\n        assert isinstance(entry['expected_failure'], str) and entry['expected_failure'], f'missing expected failure category for {path.name}'\n        assert 'expected' not in entry, f'negative fixture must not declare positive expected content for {path.name}'\n    else:\n        assert isinstance(entry.get('expected'), dict) and entry['expected'], f'missing expected content for {path.name}'\n"
          if old not in validator:
              raise SystemExit('validator anchor missing')
          validator_path.write_text(validator.replace(old, new, 1), encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '\n- `truncated-header-kdbx4.kdbx`: deterministic negative fixture containing only the first 8 bytes of the basic KDBX4 file; future vault engines must reject it as a truncated header without panic.\n'
          if 'truncated-header-kdbx4.kdbx' not in readme:
              readme_path.write_text(readme.rstrip() + '\n' + note, encoding='utf-8')
          PY
          python3 tools/validate_kdbx_fixtures.py
          git diff --check
      - name: Commit fixture and remove helper
        run: |
          rm -f .github/workflows/automation-materialize-truncated-kdbx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: add truncated KDBX negative fixture'
          git push origin HEAD:main
