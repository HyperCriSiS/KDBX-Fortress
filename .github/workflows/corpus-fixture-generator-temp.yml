name: Accepted corpus fixture generator (temporary)

on:
  push:
    branches:
      - test/kdbx-accepted-corpus-gaps

permissions:
  contents: write

jobs:
  generate:
    if: "github.event.head_commit.message != 'test: materialize accepted corpus gaps'"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install KeePassXC
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes keepassxc
          keepassxc-cli --version

      - name: Generate independent KDBX fixtures
        shell: bash
        env:
          FIXTURE_PASSWORD: fixture-password
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/fortress-corpus"
          mkdir -p "$work"
          empty_db="$work/kdbx4-empty-edge.kdbx"
          large_db="$work/kdbx4-large-bounded.kdbx"
          large_attachment="$work/payload.bin"
          large_notes="$work/large-notes.txt"

          create_db() {
            local path="$1"
            printf '%s\n%s\n' "$FIXTURE_PASSWORD" "$FIXTURE_PASSWORD" | \
              keepassxc-cli db-create -p -t 100 "$path"
          }

          create_db "$empty_db"
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli mkdir "$empty_db" 'Empty Group'
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli add --username '' --url '' --notes '' "$empty_db" 'Blank Fields'

          create_db "$large_db"
          python - <<'PY'
          from pathlib import Path
          import os

          work = Path(os.environ['RUNNER_TEMP']) / 'fortress-corpus'
          work.joinpath('payload.bin').write_bytes(bytes(range(256)) * 1024)
          work.joinpath('large-notes.txt').write_text('N' * 65536, encoding='utf-8')
          PY
          notes="$(cat "$large_notes")"
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli add \
              --username 'large-user' \
              --url 'https://large.example.test' \
              --notes "$notes" \
              "$large_db" 'Large Fixture'
          printf '%s\n' "$FIXTURE_PASSWORD" | \
            keepassxc-cli attachment-import \
              "$large_db" 'Large Fixture' 'payload.bin' "$large_attachment"

          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli db-info "$empty_db" >/dev/null
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli db-info "$large_db" >/dev/null
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli show --all "$empty_db" 'Blank Fields' >/dev/null
          printf '%s\n' "$FIXTURE_PASSWORD" | keepassxc-cli show --all --show-attachments "$large_db" 'Large Fixture' >/dev/null

          base64 -w 0 "$empty_db" > test-fixtures/kdbx/kdbx4-empty-edge.kdbx.b64
          base64 -w 0 "$large_db" > test-fixtures/kdbx/kdbx4-large-bounded.kdbx.b64

          export EMPTY_DB="$empty_db"
          export LARGE_DB="$large_db"
          export LARGE_ATTACHMENT="$large_attachment"
          export KEEPASSXC_VERSION="$(keepassxc-cli --version | tr -d '\r')"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          manifest_path = Path('test-fixtures/kdbx/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = {entry['file'] for entry in manifest['fixtures']}

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          creator = {
              'implementation': 'KeePassXC CLI',
              'version': os.environ['KEEPASSXC_VERSION'],
          }

          additions = [
              {
                  'file': 'kdbx4-empty-edge.kdbx.b64',
                  'encoding': 'base64',
                  'sha256': sha256(os.environ['EMPTY_DB']),
                  'password': 'fixture-password',
                  'format': 'KDBX4',
                  'creator': creator,
                  'kdf': {'name': 'Argon2id'},
                  'outer_cipher': 'AES-256-CBC',
                  'purpose': 'independently generated KDBX4 fixture covering empty strings, omitted optional entry fields and an empty group',
                  'expected': {
                      'empty_group': 'Empty Group',
                      'entry': 'Blank Fields',
                      'username': '',
                      'url': '',
                      'notes': '',
                      'optional_fields': 'missing-or-empty',
                  },
              },
              {
                  'file': 'kdbx4-large-bounded.kdbx.b64',
                  'encoding': 'base64',
                  'sha256': sha256(os.environ['LARGE_DB']),
                  'password': 'fixture-password',
                  'format': 'KDBX4',
                  'creator': creator,
                  'kdf': {'name': 'Argon2id'},
                  'outer_cipher': 'AES-256-CBC',
                  'purpose': 'independently generated KDBX4 fixture with a large entry field and deterministic attachment for near-limit acceptance/rejection tests',
                  'expected': {
                      'entry': 'Large Fixture',
                      'username': 'large-user',
                      'url': 'https://large.example.test',
                      'notes_bytes': 65536,
                      'attachment': {
                          'name': 'payload.bin',
                          'size': 262144,
                          'sha256': sha256(os.environ['LARGE_ATTACHMENT']),
                      },
                  },
              },
          ]

          for entry in additions:
              if entry['file'] not in files:
                  manifest['fixtures'].append(entry)

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python tools/validate_kdbx_fixtures.py

      - name: Commit fixtures
        shell: bash
        run: |
          git diff --check
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add \
            test-fixtures/kdbx/kdbx4-empty-edge.kdbx.b64 \
            test-fixtures/kdbx/kdbx4-large-bounded.kdbx.b64 \
            test-fixtures/kdbx/manifest.json
          git commit -m "test: materialize accepted corpus gaps"
          git push origin HEAD:test/kdbx-accepted-corpus-gaps