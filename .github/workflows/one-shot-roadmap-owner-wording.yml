name: One-shot owner roadmap wording
on:
  push:
    branches: [security/pin-memory-hardened-engine]
    paths: [.github/workflows/one-shot-roadmap-owner-wording.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/pin-memory-hardened-engine
      - name: Align roadmap wording
        shell: python
        run: |
          from pathlib import Path
          p = Path("ROADMAP.md")
          s = p.read_text()
          old = "  - [ ] Integrate the registry into a concrete Rust vault owner/lifecycle API and then a Kotlin/JNI wrapper; preserve Rust-only ownership of decrypted vault state and do not expose production `open_vault` until secret-buffer hygiene is proven."
          new = "  - [ ] Integrate the registry into a concrete Rust vault owner/lifecycle API; preserve Rust-only ownership of decrypted vault state, prove immediate owner drop on `lock`/`lock_all`, and only then expose the bounded read-only owner through Kotlin/JNI."
          assert old in s
          p.write_text(s.replace(old, new))
      - run: rm .github/workflows/one-shot-roadmap-owner-wording.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/one-shot-roadmap-owner-wording.yml
          git commit -m "docs: align concrete owner roadmap gate"
          git push origin HEAD:security/pin-memory-hardened-engine