name: Sync accepted-corpus documentation (temporary)

on:
  push:
    branches:
      - test/kdbx-accepted-corpus-gaps

permissions:
  contents: write

jobs:
  sync:
    if: "github.event.head_commit.message != 'docs: close accepted corpus fixture gaps'"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply deterministic documentation updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Fixture manifest: the final KeePass-produced fixture preserves the template's empty Synthetic group.
          manifest_path = Path('test-fixtures/kdbx/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          fixture = next(item for item in manifest['fixtures'] if item['file'] == 'kdbx4-empty-edge.kdbx.b64')
          fixture['expected']['empty_group'] = 'Synthetic'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replace_once(
              'test-fixtures/kdbx/README.md',
              '`manifest.json` records the fixture password, expected logical content and immutable SHA-256 digest. The first fixture is a minimal KDBX4 password-only database; later fixtures extend the matrix to KDBX3, keyfiles, Argon2id/AES-KDF, ChaCha20, attachments, history, Unicode and negative/adversarial cases.',
              '`manifest.json` records each fixture password, expected logical content, provenance and immutable SHA-256 digest. The corpus combines deterministic project-generated cases with independently generated KeePass reference fixtures and extends the matrix across KDBX3/KDBX4, keyfiles, Argon2d/Argon2id/AES-KDF, AES/ChaCha20, attachments, history, Unicode, empty/optional-value edges, bounded-large inputs and negative/adversarial cases.'
          )
          readme = Path('test-fixtures/kdbx/README.md')
          text = readme.read_text(encoding='utf-8')
          appendix = '''\n\n`kdbx4-empty-edge.kdbx.b64` is an independently materialized KeePass 2.61.1/KPScript/KeePassLib KDBX 4.0 fixture. It preserves the template's empty `Synthetic` group and adds `Blank Fields` with empty optional values. The Rust corpus test accepts either omitted or explicitly empty optional fields and rejects invented non-empty values.\n\n`kdbx4-large-bounded.kdbx.b64` is an independently materialized KeePass 2.61.1/KeePassLib KDBX 4.0 fixture with a 65,536-byte `Notes` value and a deterministic 262,144-byte `payload.bin` attachment (`byte[i] = i mod 256`). Its Rust tests verify exact content, accept the fixture at the exact configured field/attachment ceilings, and require typed rejection when those ceilings are lowered by one byte.\n'''
          if '`kdbx4-empty-edge.kdbx.b64` is an independently materialized KeePass' not in text:
              readme.write_text(text.rstrip() + appendix, encoding='utf-8')

          replace_once(
              'docs/KDBX_COMPATIBILITY_MATRIX.md',
              '| `kdbx4-empty-edge` | KDBX 4.x | Argon2id | AES-256 | empty strings, missing optional fields, empty groups | no invented values or crashes |',
              '| `kdbx4-empty-edge` | KDBX 4.0 | Argon2d | AES-256 | empty strings, missing optional fields, empty groups | no invented values or crashes |'
          )
          replace_once(
              'docs/KDBX_COMPATIBILITY_MATRIX.md',
              '| `kdbx4-large-bounded` | KDBX 4.x | Argon2id | AES-256 | bounded large attachment/custom fields near configured limits | accepted within limits; deterministic rejection above limits |',
              '| `kdbx4-large-bounded` | KDBX 4.0 | Argon2d | AES-256 | 65,536-byte Notes value and deterministic 262,144-byte attachment | exact content preserved; exact configured boundary accepted; one-byte-lower ceilings reject with typed errors |'
          )
          matrix = Path('docs/KDBX_COMPATIBILITY_MATRIX.md')
          text = matrix.read_text(encoding='utf-8')
          marker = '## Read compatibility gate\n'
          section = '''### Materialized accepted-edge reference fixtures\n\nThe Phase 0 accepted corpus now includes two KDBX 4.0 edge fixtures materialized with pinned KeePass 2.61.1/KPScript/KeePassLib rather than the Fortress serializer:\n\n- `kdbx4-empty-edge.kdbx.b64`: empty `Synthetic` group plus a `Blank Fields` entry whose optional string values are empty/omitted; the read assertion forbids invented non-empty values.\n- `kdbx4-large-bounded.kdbx.b64`: exact 65,536-byte Notes value plus deterministic 262,144-byte `payload.bin`; Fortress accepts the exact configured field/attachment ceilings and rejects one-byte-lower field, per-attachment and aggregate-attachment ceilings through typed errors.\n\nTheir decoded SHA-256 values and creator/version metadata are fixed in `test-fixtures/kdbx/manifest.json`. This closes the remaining positive fixture-matrix materialization gaps; the separate full-corpus no-panic/no-regression gate remains required.\n\n'''
          if '### Materialized accepted-edge reference fixtures' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('compatibility matrix read-gate marker not unique')
              matrix.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

          roadmap_replacements = [
              (
                  'Status: **Phase 0 in progress; the bounded read-only KDBX path enforces the required resource budgets, KDBX4 test serialization is guarded against silent minor-version and unknown-XML loss, and both independent KeePassXC and KeePass 2.x/KPScript reopen gates are automated. Remaining Phase 0 blockers are the accepted-corpus gaps plus stable API and memory-hygiene work.**',
                  'Status: **Phase 0 in progress; the bounded read-only KDBX path enforces the required resource budgets, the positive compatibility fixture matrix is materialized through independent KeePass-produced edge fixtures, KDBX4 test serialization is guarded against silent minor-version and unknown-XML loss, and both independent KeePassXC and KeePass 2.x/KPScript reopen gates are automated. Remaining Phase 0 blockers are the full-corpus no-panic/no-regression gate plus stable API and memory-hygiene work.**'
              ),
              (
                  'Repository base before this roadmap update: `main` at `5832e1bd884c695eccb62c8003a717dc5bfc4a1f`.',
                  'Repository base before this roadmap update: `main` at `38085ca30d6fb87cf4c2d8d64770ea8aa4bd7708`.'
              ),
              (
                  '- The Rust core is an isolated `cdylib`/JNI scaffold and pins the Fortress `keepass-rs` fork at commit `d343a639145d9b60d8abe6affdd9506310d56b11` (package line based on 0.13.18) as the initial read-validation KDBX engine behind an engine-neutral validation approach.',
                  '- The Rust core is an isolated `cdylib`/JNI scaffold and pins the Fortress `keepass-rs` fork at commit `2c70c4b56f124ee19c5c338ef33615d97eba39ba` (package line based on 0.13.18) as the initial read-validation KDBX engine behind an engine-neutral validation approach.'
              ),
              (
                  '  - [ ] Materialize synthetic KDBX fixtures plus manifests/SHA-256 across the **remaining** compatibility matrix; fixtures must be project-generated or otherwise redistributable.',
                  '  - [x] Materialize synthetic/reference KDBX fixtures plus manifests/SHA-256 across the required positive compatibility matrix; fixtures must be project-generated or otherwise redistributable.'
              ),
              (
                  '    - [x] Materialize and exercise a generated KDBX 4 fixture requiring a composite password plus external raw-32-byte key file; validate database/key-file SHA-256 values, sidecar size and positive/negative credential combinations through the pinned Rust engine.\n',
                  '    - [x] Materialize and exercise a generated KDBX 4 fixture requiring a composite password plus external raw-32-byte key file; validate database/key-file SHA-256 values, sidecar size and positive/negative credential combinations through the pinned Rust engine.\n    - [x] Materialize an independent KeePass 2.61.1/KPScript KDBX 4.0 empty/optional-value edge fixture; verify the empty group remains empty and omitted/empty optional strings are not invented during bounded reads.\n    - [x] Materialize an independent KeePass 2.61.1/KeePassLib KDBX 4.0 bounded-large fixture with an exact 65,536-byte Notes value and deterministic 262,144-byte attachment; verify exact content, exact-limit acceptance and typed rejection when field/per-attachment/aggregate-attachment ceilings are lowered by one byte.\n'
              ),
              (
                  '1. **Write support is blocked on the remaining accepted fixture/corpus validation, not reference-tool coverage.** The version policy is explicit: initial writes target KDBX 4.1 only, KDBX 4.0 migration is a deliberate operation rather than Save, and KDBX 3.1 remains read-only. History preservation, unknown-XML fail-closed handling, KeePassXC reopening and pinned KeePass 2.x/KPScript reopening are automated; the remaining accepted fixture/corpus gaps must still be closed before production writing is considered.',
                  '1. **Write support is blocked on the remaining full-corpus validation, not positive fixture materialization or reference-tool coverage.** The version policy is explicit: initial writes target KDBX 4.1 only, KDBX 4.0 migration is a deliberate operation rather than Save, and KDBX 3.1 remains read-only. History preservation, unknown-XML fail-closed handling, KeePassXC reopening and pinned KeePass 2.x/KPScript reopening are automated; the positive fixture-matrix gaps are now materialized, but the full accepted/adversarial corpus must still pass the no-panic/no-regression gate before production writing is considered.'
              ),
              (
                  '1. [ ] Close remaining accepted fixture-matrix gaps and run the full engine/adapter corpus without panics, unbounded allocation or format regressions.',
                  '1. [ ] Run the full accepted/adversarial engine/adapter corpus without panics, unbounded allocation or format regressions; keep the newly completed positive edge fixtures in that gate.'
              ),
          ]
          for old, new in roadmap_replacements:
              replace_once('ROADMAP.md', old, new)

          Path('.github/workflows/sync-corpus-docs-temp.yml').unlink()
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python tools/validate_kdbx_fixtures.py
          git diff --check
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add -A
          git commit -m "docs: close accepted corpus fixture gaps"
          git push origin HEAD:test/kdbx-accepted-corpus-gaps