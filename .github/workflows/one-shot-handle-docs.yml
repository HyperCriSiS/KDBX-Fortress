name: One-shot handle documentation finalizer

on:
  push:
    branches:
      - feat/vault-handle-registry

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/vault-handle-registry

      - name: Synchronize handle API and roadmap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          replacements = [
              (
                  'Status: **Phase 0 in progress; the bounded KDBX accepted/adversarial corpus gate is complete for the defined Phase-0 surface. It covers every manifest-backed fixture, derived outer-header/version/cipher/KDF, credential, truncation, integrity and representative resource-budget failures, plus cryptographically authenticated malformed decrypted XML, invalid root nesting, invalid UUID encoding and duplicate group/entry UUIDs without escaping Rust panics. The next blockers are the stable Rust handle/API model and explicit secret-buffer memory hygiene/zeroization.**',
                  'Status: **Phase 0 in progress; the defined KDBX accepted/adversarial corpus gate is complete and the first stable-handle tranche now establishes an opaque generation-checked `VaultHandle` plus a bounded Rust-owned registry with stale-handle rejection and idempotent lock/drop semantics. The stable handle/API parent remains open until a concrete Rust vault owner/lifecycle API and Kotlin/JNI wrapper are integrated. Secret-buffer memory hygiene/zeroization is the next security gate and must be proven before production vault opening is exposed.**',
              ),
              (
                  '- There is not yet a production Android application module, production vault-read JNI API, write path, Autofill implementation or release artifact.',
                  '- The first stable-handle tranche provides a positive 63-bit FFI-safe opaque `VaultHandle` and an internal bounded generation-checked registry. Handles are not pointers, raw values are redacted from `Debug`, lock/lock-all immediately drop Rust-owned values, stale handles cannot revive after slot reuse, generation exhaustion retires a slot rather than wrapping, and capacity is explicit. The registry is intentionally not yet wired to KDBX-owned decrypted state or JNI.\n- There is not yet a production Android application module, production vault-read JNI API, write path, Autofill implementation or release artifact.',
              ),
              (
                  '- [ ] Define the stable Rust handle/API model and Kotlin wrapper while preserving the invariant that decrypted vault state remains inside Rust.\n- [ ] Add explicit memory hygiene for composite keys and sensitive secret buffers, including zeroization wrappers where upstream types retain owned secret material.',
                  '- [ ] Define the stable Rust handle/API model and Kotlin wrapper while preserving the invariant that decrypted vault state remains inside Rust.\n  - [x] Establish the opaque handle/registry foundation without production KDBX or JNI integration: positive 63-bit non-pointer `VaultHandle`, checked raw decoding, one-based slot + generation encoding, explicit registry capacity, stale-handle rejection after slot reuse, idempotent per-handle/global lock, immediate Rust-value drop, non-wrapping generation retirement and redacted `Debug` output.\n  - [ ] Integrate the registry into a concrete Rust vault owner/lifecycle API and then a Kotlin/JNI wrapper; preserve Rust-only ownership of decrypted vault state and do not expose production `open_vault` until secret-buffer hygiene is proven.\n- [ ] Add explicit memory hygiene for composite keys and sensitive secret buffers, including zeroization wrappers where upstream types retain owned secret material.',
              ),
              (
                  '1. **Production KDBX open/decrypt exposure is now blocked on the stable Rust handle/API model and secret-buffer memory hygiene/zeroization.** The Phase-0 accepted/adversarial corpus, write-policy/round-trip evidence, Fortress-owned resource-budget gates and independent KeePassXC/KeePass reopening gates are complete for the defined surface.\n2. **Production Android vault operations are blocked on the stable Rust handle/JNI contract and secret-buffer memory hygiene.**',
                  '1. **Production KDBX open/decrypt exposure is blocked on secret-buffer memory hygiene/zeroization and completion of the concrete Rust vault owner/lifecycle API.** The foundational opaque generation-checked handle registry is implemented, while the Phase-0 accepted/adversarial corpus, write-policy/round-trip evidence, Fortress-owned resource-budget gates and independent KeePassXC/KeePass reopening gates are complete for the defined surface.\n2. **Production Android vault operations remain blocked on the concrete Rust owner/API plus Kotlin/JNI wrapper and secret-buffer memory hygiene.**',
              ),
              (
                  '1. [ ] Define and implement the stable Rust handle/API model while preserving the invariant that decrypted vault state remains inside Rust.\n2. [ ] Define and implement the zeroization/secret-buffer strategy for passwords, composite-key material, key-file bytes and sensitive temporary buffers.\n3. [ ] Extend the JNI contract only after the stable handle/API and secret-memory gates are proven, beginning with bounded read-only vault operations.',
                  '1. [ ] Define and implement the zeroization/secret-buffer strategy for passwords, composite-key material, key-file bytes and sensitive temporary buffers; document unavoidable upstream copies and eliminate Fortress-owned residual secret buffers on drop/error paths.\n2. [ ] Integrate the proven handle registry into a concrete Rust vault owner/lifecycle API while preserving the invariant that decrypted vault state remains inside Rust.\n3. [ ] Add the Kotlin/JNI wrapper only after the secret-memory and concrete Rust owner/API gates are proven, beginning with bounded read-only vault operations and stable sanitized errors.',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'ROADMAP anchor missing: {old[:100]}')
              text = text.replace(old, new)
          roadmap.write_text(text, encoding='utf-8')

          api = Path('docs/VAULT_CORE_API.md')
          text = api.read_text(encoding='utf-8')
          replacements = [
              (
                  '### `VaultHandle`\n\nOpaque process-local identifier with generation/version checking. It is never persisted. Lock/drop invalidates it.',
                  '''### `VaultHandle`\n\nOpaque process-local identifier with generation checking. It is **not a pointer** and is never persisted. Lock/drop invalidates it.\n\nThe Phase-0 handle foundation uses a positive 63-bit integer representation suitable for a future JNI `jlong` / Kotlin `Long` bridge:\n\n- low 32 bits: one-based registry slot token; zero is invalid;\n- next 31 bits: non-zero generation;\n- top bit: always zero, so a valid raw handle never becomes a negative Java/Kotlin `Long`.\n\nBridge callers must treat this value as opaque process-local capability metadata. It must not be logged, persisted, exported, placed in Android intents/bundles, or interpreted as an address. Raw decoding validates the representation before registry lookup. Every registry operation then validates slot, generation and liveness. A stale, locked, out-of-range or malformed handle maps to the same stable invalid-handle category rather than leaking registry state.\n\nThe registry is explicitly bounded. Lock immediately drops the Rust-owned session value and advances its generation; repeated lock is a no-op. Reusing a vacant slot therefore produces a different handle, so a copied stale handle cannot revive. Generation exhaustion permanently retires the slot instead of wrapping. `lock_all` is likewise idempotent and drops every live Rust-owned value. Handle `Debug` output is redacted.\n\nThis foundation is implemented independently of production KDBX state and JNI. The registry remains internal until the concrete Rust vault-owner API is introduced after the secret-memory gate.''',
              ),
              (
                  '- `lock_vault` is idempotent and invalidates all future reads/mutations for that handle.\n- resource limits are explicit for hostile KDBX inputs.',
                  '- `lock_vault` is idempotent, immediately drops the Rust-owned vault session value and invalidates all future reads/mutations for that handle.\n- slot reuse must advance the generation; a stale handle must never become valid again. Generation exhaustion retires the slot rather than wrapping.\n- malformed/stale/already-locked handles must not expose whether a registry slot exists.\n- the unlocked-session registry has an explicit capacity bound; capacity failure must not disturb existing live sessions.\n- resource limits are explicit for hostile KDBX inputs.',
              ),
              (
                  '- All handles are validated against a registry/generation.\n- Catch panics at the outer FFI boundary and translate them to `VaultError::Internal`.',
                  '- All handles are validated against a registry/generation. Raw handle values are opaque positive integers, never native pointers.\n- The high bit of the current raw-handle encoding remains zero so JNI/Kotlin signed integer conversion cannot reinterpret a valid handle as negative.\n- Handle values are redacted from Rust `Debug` output and must not be logged by bridge code.\n- Catch panics at the outer FFI boundary and translate them to `VaultError::Internal`.',
              ),
              (
                  '## Initial implementation sequence\n\n1. Implement handle registry + lock semantics without KDBX parsing.\n2. Add read-only `open_vault` against deterministic KDBX fixtures.\n3. Add group/entry metadata listing and explicit single-secret retrieval.\n4. Add malformed-input/property/fuzz tests.\n5. Only then add mutation and serialization/round-trip support.',
                  '''## Initial implementation sequence\n\n1. [x] Implement the opaque generation-checked handle registry + idempotent lock semantics without production KDBX parsing/JNI integration.\n2. [ ] Complete the secret-buffer zeroization/memory-hygiene gate before decrypted vault state is retained behind handles.\n3. [ ] Integrate the registry into a concrete Rust vault owner and add read-only `open_vault` against deterministic KDBX fixtures.\n4. [ ] Add the Kotlin/JNI wrapper, group/entry metadata listing and explicit single-secret retrieval with stable sanitized errors.\n5. [ ] Add lifecycle/concurrency/property/fuzz coverage around the concrete owner/bridge boundary.\n6. [ ] Only then add mutation and serialization/round-trip support.\n\n### Current handle-registry implementation evidence\n\nThe first tranche is deliberately smaller than the full lifecycle API. It currently proves:\n\n- structurally checked raw-handle decoding with no pointer interpretation;\n- stale-handle rejection after slot reuse;\n- idempotent single-handle and global lock;\n- immediate destruction of the Rust-owned registered value on lock;\n- explicit registry-capacity failure without disturbing live values;\n- mutable access only through the current generation;\n- slot retirement on generation exhaustion rather than wraparound;\n- destruction of remaining live values when the registry itself is dropped;\n- redacted handle `Debug` output.\n\nIt does **not** yet claim production KDBX ownership, JNI exposure, secret-memory zeroization, concurrency semantics, or Android lifecycle integration.''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'API anchor missing: {old[:100]}')
              text = text.replace(old, new)
          api.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit documentation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-handle-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record vault handle registry tranche"
          git push origin HEAD:feat/vault-handle-registry
