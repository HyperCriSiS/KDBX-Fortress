name: Concrete owner docs finalizer

on:
  push:
    branches:
      - feat/concrete-vault-owner
    paths:
      - .github/workflows/one-shot-owner-docs-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/concrete-vault-owner
      - name: Apply evidence-backed docs
        run: python .github/scripts/owner_docs_finalize.py
      - name: Remove temporary helpers
        run: rm .github/scripts/owner_docs_finalize.py .github/workflows/one-shot-owner-docs-v2.yml
      - name: Commit final docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/VAULT_CORE_API.md .github/scripts/owner_docs_finalize.py .github/workflows/one-shot-owner-docs-v2.yml
          git commit -m "docs: record concrete Rust vault owner gate"
          git push origin HEAD:feat/concrete-vault-owner
