name: Finalize empty-edge fixture

"on":
  push:
    branches:
      - test/kdbx-empty-edge-fixture

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/kdbx-empty-edge-fixture
          persist-credentials: true

      - name: Finalize corpus tests and remove temporary CI
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/empty-edge-finalize.yml ]; then
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          roundtrip = Path('rust/vault-core/tests/kdbx_roundtrip.rs')
          text = roundtrip.read_text()
          helper = '''fn round_trip_kdbx41_password_fixture(
              bytes: &[u8],
              interop_artifact_name: &str,
          ) -> Result<Database, Box<dyn Error>> {
              let database = open_password_fixture(bytes)?;
              if database.config.version != DatabaseVersion::KDB4(1) {
                  return Err(IoError::other(format!(
                      "expected KDBX 4.1 fixture, got {}",
                      database.config.version
                  ))
                  .into());
              }

              let mut serialized = Vec::new();
              database
                  .save(&mut serialized, password_key())
                  .map_err(|error| IoError::other(format!("KDBX 4.1 save failed: {error}")))?;
              maybe_write_interop_artifact(interop_artifact_name, &serialized)?;
              open_password_fixture(&serialized)
          }

          '''
          marker = 'fn assert_example_entry(database: &Database) -> Result<(), Box<dyn Error>> {'
          if 'fn round_trip_kdbx41_password_fixture' not in text:
              if marker not in text:
                  raise SystemExit('roundtrip helper insertion marker missing')
              text = text.replace(marker, helper + marker, 1)

          test = '''

          #[test]
          fn kdbx41_empty_edge_round_trip_preserves_empty_vs_missing_values() -> Result<(), Box<dyn Error>> {
              let database = round_trip_kdbx41_password_fixture(
                  include_bytes!("../../../test-fixtures/kdbx/kdbx4-empty-edge.kdbx"),
                  "empty-edge-41.kdbx",
              )?;

              assert_eq!(database.config.version, DatabaseVersion::KDB4(1));
              assert!(
                  !database.has_ignored_xml_fields(),
                  "round-tripped accepted fixture must not acquire ignored XML"
              );

              let root = database.root();
              let edge_group = root
                  .group_by_path(&["Edge Cases"])
                  .ok_or_else(|| IoError::other("Edge Cases group must exist"))?;

              let empty = edge_group
                  .entry_by_name("Empty Strings")
                  .ok_or_else(|| IoError::other("Empty Strings entry must exist"))?;
              assert_eq!(empty.get_username(), Some(""));
              assert_eq!(empty.get_password(), Some(""));
              assert_eq!(empty.get_url(), Some(""));
              assert_eq!(empty.get(fields::NOTES), Some(""));
              assert_eq!(empty.get("EmptyCustom"), Some(""));
              assert!(
                  empty
                      .fields
                      .get(fields::PASSWORD)
                      .is_some_and(|value| value.is_protected()),
                  "empty password must remain protected after round trip"
              );

              let sparse = edge_group
                  .entry_by_name("Sparse Entry")
                  .ok_or_else(|| IoError::other("Sparse Entry must exist"))?;
              assert_eq!(sparse.get_username(), None);
              assert_eq!(sparse.get_password(), None);
              assert_eq!(sparse.get_url(), None);
              assert_eq!(sparse.get(fields::NOTES), None);

              let fieldless = edge_group
                  .entries()
                  .find(|entry| entry.fields.is_empty())
                  .ok_or_else(|| IoError::other("field-less entry must exist"))?;
              assert_eq!(fieldless.get_title(), None);

              let empty_group = root
                  .group_by_path(&["Empty Group"])
                  .ok_or_else(|| IoError::other("Empty Group must exist"))?;
              assert!(empty_group.entries().next().is_none());
              assert!(empty_group.groups().next().is_none());

              Ok(())
          }
          '''
          if 'kdbx41_empty_edge_round_trip_preserves_empty_vs_missing_values' not in text:
              text = text.rstrip() + test + '\n'
          roundtrip.write_text(text)

          workflow = Path('.github/workflows/foundation.yml')
          text = workflow.read_text()

          temp_job = '\n  empty-edge-fixture-generator:\n'
          if temp_job in text:
              text = text.split(temp_job, 1)[0].rstrip() + '\n'

          if '            empty-edge-41.kdbx\n' not in text:
              text = text.replace(
                  '            history-41.kdbx\n          )',
                  '            history-41.kdbx\n            empty-edge-41.kdbx\n          )',
                  1,
              )
          if "            'empty-edge-41.kdbx'" not in text:
              text = text.replace(
                  "            'history-41.kdbx'\n          )",
                  "            'history-41.kdbx',\n            'empty-edge-41.kdbx'\n          )",
                  1,
              )

          download_start = text.find('          & curl.exe --fail --location --retry 3 --retry-delay 2 --output $keepassZip')
          download_end_marker = "          Assert-ReferencePackage -Path $kpscriptZip -ExpectedSize 24707 -ExpectedSha256 '06C9D95332FE7B2730E4E7FD0ABA846C5FA9A1B0CD3119DEFEA9875727A3BFFB'\n"
          if download_start != -1:
              download_end = text.find(download_end_marker, download_start)
              if download_end == -1:
                  raise SystemExit('reference download replacement end marker missing')
              download_end += len(download_end_marker)
              verified_download = '''          function Get-VerifiedReferencePackage {
            param(
              [Parameter(Mandatory = $true)][string]$BaseUri,
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][long]$ExpectedSize,
              [Parameter(Mandatory = $true)][string]$ExpectedSha256
            )

            for ($attempt = 1; $attempt -le 4; $attempt++) {
              if (Test-Path -LiteralPath $Path) { Remove-Item -LiteralPath $Path -Force }
              $separator = if ($BaseUri.Contains('?')) { '&' } else { '?' }
              $uri = "${BaseUri}${separator}fortress_attempt=$attempt"

              & curl.exe --fail --location --retry 2 --retry-all-errors --retry-delay 2 --user-agent 'KDBX-Fortress-CI/1.0' --output $Path $uri
              if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $Path)) {
                $item = Get-Item -LiteralPath $Path
                if ($item.Length -eq $ExpectedSize) {
                  $actualSha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToUpperInvariant()
                  if ($actualSha256 -eq $ExpectedSha256) { return }
                }
              }

              Start-Sleep -Seconds (2 * $attempt)
            }

            throw "Unable to obtain verified reference package: $(Split-Path -Leaf $Path)"
          }

          Get-VerifiedReferencePackage -BaseUri 'https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.61.1/KeePass-2.61.1.zip/download?use_mirror=phoenixnap' -Path $keepassZip -ExpectedSize 2898806 -ExpectedSha256 '3952354DB9B117E906F7CD4F9F5591065B95186472370DA47F46F3E246FEA864'
          Get-VerifiedReferencePackage -BaseUri 'https://keepass.info/extensions/v2/kpscript/KPScript-2.61.1.zip' -Path $kpscriptZip -ExpectedSize 24707 -ExpectedSha256 '06C9D95332FE7B2730E4E7FD0ABA846C5FA9A1B0CD3119DEFEA9875727A3BFFB'
'''
              text = text[:download_start] + verified_download + text[download_end:]
          workflow.write_text(text)

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          anchor = '    - [x] Materialize and exercise a generated KDBX 4 fixture requiring a composite password plus external raw-32-byte key file; validate database/key-file SHA-256 values, sidecar size and positive/negative credential combinations through the pinned Rust engine.\n'
          addition = '    - [x] Materialize and exercise a deterministic KDBX 4.1 empty-edge fixture covering present-but-empty values, absent optional fields, a field-less entry and an empty group; validate the committed SHA-256 and preserve the distinctions through read, round-trip, KeePassXC and KeePass 2.x/KPScript checks.\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('ROADMAP empty-edge insertion anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          old = '- Deterministic generated fixtures and executable Rust tests cover KDBX 3.1 and KDBX 4 variants, including AES-KDF, Argon2d, Argon2id, AES-256-CBC, ChaCha20 outer encryption, protected fields, Unicode, attachments, `CustomData`, and password + raw-32-byte key-file composite credentials.'
          new = '- Deterministic generated fixtures and executable Rust tests cover KDBX 3.1 and KDBX 4 variants, including AES-KDF, Argon2d, Argon2id, AES-256-CBC, ChaCha20 outer encryption, protected fields, Unicode, attachments, `CustomData`, password + raw-32-byte key-file composite credentials, and empty/missing-field edge semantics.'
          if old in text:
              text = text.replace(old, new, 1)
          roadmap.write_text(text)
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all
          python tools/validate_kdbx_fixtures.py

          rm -f .github/workflows/generate-empty-edge-fixture.yml
          rm -f .github/workflows/empty-edge-finalize.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: complete KDBX4 empty-edge corpus coverage"
          git push origin HEAD:test/kdbx-empty-edge-fixture
