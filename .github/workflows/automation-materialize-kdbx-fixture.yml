name: automation materialize KDBX fixture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate synthetic KDBX4 fixture and validator
        run: |
          python -m pip install --disable-pip-version-check pykeepass
          mkdir -p test-fixtures/kdbx
          python - <<'PY'
          from pathlib import Path
          from pykeepass import create_database
          import hashlib, json
          out = Path('test-fixtures/kdbx/basic-kdbx4.kdbx')
          kp = create_database(str(out), password='fixture-password')
          group = kp.add_group(kp.root_group, 'Synthetic')
          kp.add_entry(group, 'Example Login', 'fixture-user', 'fixture-secret', url='https://example.test', notes='Synthetic interoperability fixture; contains no real credentials.')
          kp.save()
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          manifest = {
            'schema': 1,
            'fixtures': [{
              'file': out.name,
              'sha256': digest,
              'password': 'fixture-password',
              'format': 'KDBX4',
              'purpose': 'minimal password-only interoperability smoke fixture',
              'expected': {
                'group': 'Synthetic',
                'title': 'Example Login',
                'username': 'fixture-user',
                'password': 'fixture-secret',
                'url': 'https://example.test'
              }
            }]
          }
          Path('test-fixtures/kdbx/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cat > tools/validate_kdbx_fixtures.py <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          FIXTURES = ROOT / 'test-fixtures' / 'kdbx'
          manifest = json.loads((FIXTURES / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('schema') == 1, 'unsupported KDBX fixture manifest schema'
          entries = manifest.get('fixtures')
          assert isinstance(entries, list) and entries, 'KDBX fixture manifest must not be empty'
          for entry in entries:
              path = FIXTURES / entry['file']
              assert path.is_file(), f'missing KDBX fixture: {path}'
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == entry['sha256'], f'SHA-256 mismatch for {path.name}'
              assert entry.get('format') in {'KDBX3', 'KDBX4'}, f'unsupported format label for {path.name}'
              assert isinstance(entry.get('expected'), dict) and entry['expected'], f'missing expected content for {path.name}'
          print(f'validated {len(entries)} KDBX fixture(s)')
          PY
          cat > test-fixtures/kdbx/README.md <<'EOF'
          # KDBX interoperability fixtures

          This directory contains synthetic databases used only for compatibility tests. They contain no real credentials.

          `manifest.json` records the fixture password, expected logical content and immutable SHA-256 digest. The first fixture is a minimal KDBX4 password-only database; later fixtures extend the matrix to KDBX3, keyfiles, Argon2id/AES-KDF, ChaCha20, attachments, history, Unicode and negative/adversarial cases.

          Validate the corpus with:

          ```bash
          python tools/validate_kdbx_fixtures.py
          ```
          EOF
          python tools/validate_kdbx_fixtures.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/run_foundation_checks.py')
          s = p.read_text()
          needle = 'validate_kdbx_fixtures.py'
          if needle not in s:
              if s.endswith('\n'):
                  s += "\n# KDBX fixture integrity\n"
              s += "import runpy\nrunpy.run_path(str(ROOT / 'tools' / 'validate_kdbx_fixtures.py'), run_name='__main__')\n"
              p.write_text(s)
          r = Path('ROADMAP.md')
          text = r.read_text()
          entry = '- [x] Materialize the first synthetic KDBX4 password-only interoperability fixture with manifest/SHA-256 validation; expand the corpus across the remaining compatibility matrix.\n'
          if entry not in text:
              lines = text.splitlines(keepends=True)
              insert_at = None
              for i, line in enumerate(lines):
                  if 'fixture' in line.lower() and line.lstrip().startswith('- [ ]'):
                      insert_at = i + 1
                      break
              if insert_at is None:
                  for i, line in enumerate(lines):
                      if 'KDBX' in line and line.lstrip().startswith('- [ ]'):
                          insert_at = i + 1
                          break
              if insert_at is None:
                  raise SystemExit('ROADMAP KDBX fixture anchor not found')
              lines.insert(insert_at, entry)
              r.write_text(''.join(lines))
          PY
      - name: Run foundation checks
        run: python tools/run_foundation_checks.py
      - name: Commit fixture and remove temporary workflow
        run: |
          rm .github/workflows/automation-materialize-kdbx-fixture.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add test-fixtures/kdbx tools/validate_kdbx_fixtures.py tools/run_foundation_checks.py ROADMAP.md .github/workflows/automation-materialize-kdbx-fixture.yml
          git diff --cached --check
          git commit -m 'test: add first KDBX interoperability fixture'
          git push origin HEAD:main
