name: One-shot handle registry formatter

on:
  push:
    branches:
      - feat/vault-handle-registry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/vault-handle-registry

      - name: Format Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-handle-format.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format vault handle registry"
          git push origin HEAD:feat/vault-handle-registry
