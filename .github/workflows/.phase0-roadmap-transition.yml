name: Phase 0 roadmap transition

on:
  push:
    branches:
      - test/jni-lifecycle-hardening

permissions:
  contents: write

jobs:
  transition:
    if: github.event.head_commit.message == 'chore: transition Phase 0 roadmap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark proven Phase 0 stress gate complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          replacements = [
              (
                  "Status: **Phase 0 in progress; the defined KDBX accepted/adversarial corpus gate, opaque generation-checked handle registry, Fortress credential boundary, engine-owned secret-memory/zeroization gate, concrete Rust vault-owner lifecycle, executable Android/Kotlin JNI caller, bounded `open`/`lock`/`is-valid`, and the dedicated JNI lifecycle-hardening gate are complete. Adapter ABI v3 now contains owner-operation panics while the Rust mutex is held, fails closed on poisoned-owner recovery, proves malformed/stale handles remain harmless across generation/slot reuse, and adds one bounded `lock-all` lifecycle export. The Android emulator proves two real Rust-owned KDBX sessions are invalidated by `Activity.onStop()` after an actual foreground → background transition. The next security-critical tranche is deterministic lifecycle/concurrency/property/fuzz coverage before any metadata or secret-retrieval API.**",
                  "Status: **Phase 0 complete; the defined KDBX accepted/adversarial corpus gate, opaque generation-checked handle registry, Fortress credential boundary, engine-owned secret-memory/zeroization gate, concrete Rust vault-owner lifecycle, executable Android/Kotlin JNI caller, bounded `open`/`lock`/`is-valid`/`lock-all`, dedicated JNI lifecycle hardening, and deterministic lifecycle/concurrency/property/fuzz stress gate are complete. Adapter ABI v3 contains owner-operation panics while the Rust mutex is held, fails closed on poisoned-owner recovery, and keeps malformed/stale handles harmless across generation/slot reuse. The Android emulator proves two real Rust-owned KDBX sessions are invalidated by `Activity.onStop()` after an actual foreground → background transition. Deterministic stress coverage additionally proves 20,000 model-based registry transitions, 100,000 raw-handle fuzz inputs, and eight concurrent owner workers over real KDBX sessions without stale-handle revival, owner poisoning, or state escape. Phase 1 is next: create the production Android application/modules and wire the already-verified Rust library into the Android build before deliberately expanding the bounded read-only JNI surface.**"
              ),
              (
                  "1. **Production Android vault use is no longer blocked on basic JNI reachability or the dedicated lifecycle/error-boundary proof; it is blocked on owner/bridge stress coverage and the absence of a deliberately scoped production read API.** The bounded ABI-v3 wrapper now proves real Android `open`/`is-valid`/`lock`/`lock-all` behavior while decrypted databases remain Rust-owned, including panic containment, poisoned-owner fail-closed recovery, stale-generation safety and lifecycle-triggered global locking.\n2. **Metadata/secret retrieval and production Android UI wiring remain blocked on deterministic lifecycle/concurrency/property/fuzz coverage.** No broader JNI read surface is allowed until those gates preserve byte-oriented credentials, Rust-only decrypted-state ownership, opaque handles, sanitized errors and explicit lock semantics under failure, concurrency and lifecycle transitions.",
                  "1. **Production Android vault use is no longer blocked on JNI reachability, lifecycle/error-boundary hardening, or owner/bridge stress coverage; it is now blocked on the absence of a production Android application shell and deliberately scoped production read API.** The bounded ABI-v3 wrapper proves real Android `open`/`is-valid`/`lock`/`lock-all` behavior while decrypted databases remain Rust-owned, including panic containment, poisoned-owner fail-closed recovery, stale-generation safety, lifecycle-triggered global locking, model-based lifecycle stress, raw-handle fuzzing and concurrent owner contention.\n2. **Metadata/secret retrieval and production Android UI wiring may now begin only through the next Phase 1 gates.** The first step is production Android module/native-library wiring without widening JNI; subsequent read APIs must remain bounded and preserve byte-oriented credentials, Rust-only decrypted-state ownership, opaque handles, sanitized errors and explicit lock semantics."
              ),
              (
                  "3. [ ] Complete the JNI/lifecycle hardening tranche before metadata/secret retrieval or mutation APIs.\n   - [x] Prove owner-operation panic containment while the Rust mutex is held and fail closed by invalidating every live vault on both contained panics and poisoned-owner recovery.\n   - [x] Prove malformed and stale handles stay sanitized and cannot affect a newly reused registry slot/generation.\n   - [x] Prove an actual Android foreground → background transition invokes `Activity.onStop()` and `lock-all`, invalidating multiple simultaneously live Rust-owned vault handles.\n   - [ ] Expand deterministic lifecycle/concurrency/property/fuzz coverage over the bounded owner/handle model; no broader JNI read API is allowed until this stress gate is green.",
                  "3. [x] Complete the JNI/lifecycle hardening tranche before metadata/secret retrieval or mutation APIs.\n   - [x] Prove owner-operation panic containment while the Rust mutex is held and fail closed by invalidating every live vault on both contained panics and poisoned-owner recovery.\n   - [x] Prove malformed and stale handles stay sanitized and cannot affect a newly reused registry slot/generation.\n   - [x] Prove an actual Android foreground → background transition invokes `Activity.onStop()` and `lock-all`, invalidating multiple simultaneously live Rust-owned vault handles.\n   - [x] Expand deterministic lifecycle/concurrency/property/fuzz coverage over the bounded owner/handle model: 20,000 model transitions, 100,000 raw-handle fuzz inputs, and eight concurrent owner workers over real KDBX sessions pass the full Foundation gate.\n4. [ ] Begin Phase 1 by creating the production Android application/modules and wiring the verified Rust library into the Android build without broadening the JNI surface yet."
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'ROADMAP replacement target missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          api = Path('docs/VAULT_CORE_API.md')
          text = api.read_text()
          replacements = [
              (
                  "5. [ ] Complete the JNI/lifecycle hardening tranche around the concrete owner/bridge boundary.\n   - [x] Contain owner-operation panics while the Rust owner mutex is held and fail closed by locking every live vault before returning the frozen panic status.\n   - [x] Recover from an already-poisoned owner by locking all retained vaults before clearing poison and resuming service.\n   - [x] Prove malformed/stale handles remain sanitized and cannot affect a newly reused registry slot/generation.\n   - [x] Prove an actual Android foreground → background transition reaches `Activity.onStop()` and invalidates multiple live Rust-owned vaults through the bounded `lock-all` export.\n   - [ ] Add deterministic lifecycle/concurrency/property/fuzz coverage before any broader read API.\n6. [ ] Add metadata listing and explicit single-secret retrieval only after the lifecycle-hardening gates pass.",
                  "5. [x] Complete the JNI/lifecycle hardening tranche around the concrete owner/bridge boundary.\n   - [x] Contain owner-operation panics while the Rust owner mutex is held and fail closed by locking every live vault before returning the frozen panic status.\n   - [x] Recover from an already-poisoned owner by locking all retained vaults before clearing poison and resuming service.\n   - [x] Prove malformed/stale handles remain sanitized and cannot affect a newly reused registry slot/generation.\n   - [x] Prove an actual Android foreground → background transition reaches `Activity.onStop()` and invalidates multiple live Rust-owned vaults through the bounded `lock-all` export.\n   - [x] Add deterministic lifecycle/concurrency/property/fuzz coverage: 20,000 model-based registry transitions, 100,000 raw-handle fuzz inputs and eight concurrent owner workers over real KDBX sessions pass the full Foundation gate.\n6. [ ] Begin Phase 1 production Android module/native-library wiring, then add metadata listing and explicit single-secret retrieval through a deliberately bounded read-only JNI surface."
              ),
              (
                  "The registry foundation by itself does **not** establish concurrency semantics. Android lifecycle integration is now proven in the later JNI hardening tranche, while deterministic concurrency/property/fuzz coverage remains the next gate.",
                  "The registry foundation is now supplemented by deterministic model/property and raw-handle fuzz coverage plus concurrent owner-level lifecycle stress. Android lifecycle integration is proven in the JNI hardening tranche, and the full stress gate passes before any broader read API is introduced."
              ),
              (
                  "This core-owner tranche is now consumed by the bounded Android/JNI lifecycle adapter described below. Android lifecycle-triggered global locking is proven by the adapter hardening gate; metadata/secret retrieval, mutation operations, raw database references, pointers and broader concurrency guarantees remain outside this tranche.",
                  "This core-owner tranche is now consumed by the bounded Android/JNI lifecycle adapter described below. Android lifecycle-triggered global locking and deterministic concurrent owner stress are proven by the adapter hardening gate; metadata/secret retrieval, mutation operations, raw database references and pointers remain outside this tranche."
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'API replacement target missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          api.write_text(text)
          PY

      - name: Commit roadmap transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs/VAULT_CORE_API.md
          git diff --cached --check
          git commit -m "docs: complete Phase 0 stress gate"
          git push origin HEAD:test/jni-lifecycle-hardening
