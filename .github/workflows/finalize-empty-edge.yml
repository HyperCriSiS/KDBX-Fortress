name: Finalize empty-edge fixture

"on":
  push:
    branches:
      - test/kdbx-empty-edge-fixture

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/kdbx-empty-edge-fixture
          persist-credentials: true

      - name: Apply deterministic finalization
        run: |
          python tools/finalize_empty_edge.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          python tools/validate_kdbx_fixtures.py

      - name: Commit finalized corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: complete KDBX4 empty-edge corpus coverage"
          git push origin HEAD:test/kdbx-empty-edge-fixture
