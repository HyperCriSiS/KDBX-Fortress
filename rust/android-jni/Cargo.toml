[package]
name = "kdbx-fortress-android-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# JNI exports require the Rust 2024 `unsafe(no_mangle)` attribute. Unsafe code is
# denied crate-wide; the single export attribute receives a local lint exception.
# vault-core continues to inherit the stricter workspace `unsafe_code = forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
jni = { version = "=0.22.4", default-features = false }
vault-core = { package = "kdbx-fortress-vault-core", path = "../vault-core" }
